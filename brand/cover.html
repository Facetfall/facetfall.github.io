<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1440px; height: 456px; overflow: hidden; }
  .cover { position: relative; width: 1440px; height: 456px; overflow: hidden;
    background:
      radial-gradient(520px 340px at 72% 30%, rgba(138,92,255,.55), transparent 70%),
      radial-gradient(560px 360px at 22% 80%, rgba(60,200,255,.40), transparent 70%),
      linear-gradient(120deg, #0b1030, #070914 55%, #140a2a); }
  .lattice { position: absolute; inset: 0; opacity: .10;
    background-image: linear-gradient(45deg, #9fe9ff 1px, transparent 1px), linear-gradient(-45deg, #9fe9ff 1px, transparent 1px);
    background-size: 46px 46px; }
  .beam { position: absolute; width: 900px; height: 90px; left: 260px; top: 120px; transform: rotate(-18deg);
    background: linear-gradient(90deg, transparent, rgba(160,240,255,.18), transparent); filter: blur(6px); }
  .shard { position: absolute; clip-path: polygon(50% 0, 100% 40%, 50% 100%, 0 40%);
    background: linear-gradient(150deg, rgba(220,250,255,.95), rgba(95,160,255,.75) 50%, rgba(122,63,224,.85)); filter: drop-shadow(0 0 14px rgba(95,224,255,.6)); }
  .trail { position: absolute; height: 2px; transform-origin: right center;
    background: linear-gradient(90deg, transparent, rgba(141,230,255,.7)); }
  .gem { position: absolute; left: 50%; top: 18px; width: 230px; margin-left: -115px; filter: drop-shadow(0 18px 40px rgba(60,160,255,.45)); }
  .word { position: absolute; left: 0; right: 0; top: 236px; text-align: center; font-family: "Space Grotesk", sans-serif; font-weight: 700;
    font-size: 104px; letter-spacing: .02em; line-height: 1;
    background: linear-gradient(100deg, #eafcff 10%, #7fe4ff 45%, #9c7bff 80%); -webkit-background-clip: text; color: transparent;
    filter: drop-shadow(0 6px 24px rgba(95,224,255,.35)); }
  .tag { position: absolute; left: 0; right: 0; top: 356px; text-align: center; font-family: Inter, sans-serif; font-weight: 600;
    font-size: 26px; letter-spacing: .38em; text-transform: uppercase; color: #b9c3e6; }
  .tag b { color: #ffc440; font-weight: 600; }
</style></head>
<body>
<div class="cover">
  <div class="lattice"></div>
  <div class="beam"></div>
  <!-- shards falling across the banner -->
  <div class="trail" style="left:120px; top:92px; width:120px; transform: rotate(38deg)"></div>
  <div class="shard" style="left:230px; top:150px; width:46px; height:46px; transform: rotate(20deg)"></div>
  <div class="shard" style="left:120px; top:300px; width:26px; height:26px; transform: rotate(-30deg)"></div>
  <div class="shard" style="left:330px; top:60px; width:18px; height:18px"></div>
  <div class="trail" style="left:1150px; top:250px; width:150px; transform: rotate(38deg)"></div>
  <div class="shard" style="left:1290px; top:330px; width:54px; height:54px; transform: rotate(-16deg)"></div>
  <div class="shard" style="left:1200px; top:110px; width:30px; height:30px; transform: rotate(30deg)"></div>
  <div class="shard" style="left:1360px; top:180px; width:20px; height:20px"></div>
  <div class="shard" style="left:1050px; top:390px; width:16px; height:16px"></div>
  <img class="gem" src="gem.svg">
  <div class="word">FACETFALL STUDIOS</div>
  <div class="tag">Roblox games <b>&#9670;</b> Creator tools</div>
</div>
</body></html>
